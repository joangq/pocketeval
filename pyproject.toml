[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketeval"
version = "0.1.0"
description = "Minimal, typed LLM models, PocketFlow helpers, and pluggable evaluations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
flow = ["pocketflow>=0.0.1"]
litellm = ["litellm>=1.0"]
all = ["pocketflow>=0.0.1", "litellm>=1.0"]
dev = [
    "pocketflow>=0.0.1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.11",
    "ty>=0.0.1a1",
    "wemake-python-styleguide>=1.8.1",
]

[dependency-groups]
dev = [
    "pocketflow>=0.0.1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.11",
    "ty>=0.0.1a1",
    "wemake-python-styleguide>=1.8.1",
]

[tool.uv]
default-groups = ["dev"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pocketeval = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
